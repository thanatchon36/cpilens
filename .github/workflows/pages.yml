name: pages

# Serves the committed web version of the paper (docs/paper/, built by `make paper`) at /paper/.
on:
  push:
    branches: [main]
    paths: [docs/paper/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p site
          cp -r docs/paper site/paper
          printf '<!doctype html><meta charset="utf-8"><title>cpilens</title><meta http-equiv="refresh" content="0; url=paper/"><a href="paper/">cpilens: paper</a>\n' > site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
