[project]
name = "cpilens"
version = "0.1.1"
description = "Multilingual classification of product text for Thai CPI measurement, and what classification error costs in basis points."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Thanatchon Chongmankhong" }]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.3.0",
    "duckdb>=1.1",
    "matplotlib>=3.9",
    "numpy>=1.26",
    "polars>=1.10",
    "pyarrow>=17",
    "pydantic>=2.8",
    "pypdf>=5.0",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "typer>=0.12",
]

[project.scripts]
cpilens = "cpilens.cli:app"

[dependency-groups]
dev = [
    "detect-secrets>=1.5",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]
ml = [
    "scikit-learn>=1.5",
    "sentence-transformers>=6.2.0",
    "torch>=2.14.1",
    "transformers>=5.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cpilens"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Thai text in strings and comments

[tool.mypy]
python_version = "3.11"
packages = ["cpilens"]
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
